name: Release

# Push an existing tag like v0.2.0 → signs, notarizes and publishes the DMG.
#
# Required secrets in the protected release environment:
#   DEVELOPER_ID_P12        base64 of the "Developer ID Application" certificate exported as .p12
#   DEVELOPER_ID_PASSWORD   password of that .p12
#   APPLE_ID                Apple ID email used for notarization
#   APPLE_TEAM_ID           Team ID (10 characters, from developer.apple.com → Membership)
#   APPLE_APP_PASSWORD      app-specific password from appleid.apple.com
# Missing or invalid signing/notary credentials stop the release before publication.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    # Signing secrets are released only after the `release` environment's protection rules pass.
    environment: release
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_REF_TYPE: ${{ github.ref_type }}
      RELEASE_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify existing release tag
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF_TYPE" != tag || ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Select an existing vMAJOR.MINOR.PATCH tag to release."
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          TAG_COMMIT="$(git rev-parse 'FETCH_HEAD^{commit}')"
          test "$(git rev-parse HEAD)" = "$TAG_COMMIT"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TAG_COMMIT" FETCH_HEAD

      - name: Toolchain
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Stamp version
        run: |
          V="${RELEASE_TAG#v}"
          echo "V=$V" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $RELEASE_BUILD_NUMBER" Resources/Info.plist

      - name: Import Developer ID certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${P12:?DEVELOPER_ID_P12 is required}"
          : "${P12_PASSWORD:?DEVELOPER_ID_PASSWORD is required}"
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          umask 077
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(uuidgen)"
          trap 'rm -f "$RUNNER_TEMP/cert.p12"' EXIT
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          SIGN_ID="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -v team="$APPLE_TEAM_ID" \
            '/"Developer ID Application: / && index($0, "(" team ")\"") { print $2 }')"
          if [[ ! "$SIGN_ID" =~ ^[A-Fa-f0-9]{40}$ ]]; then
            echo "::error::Import exactly one valid Developer ID Application identity for APPLE_TEAM_ID."
            exit 1
          fi
          echo "SIGN_ID=$SIGN_ID" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SIGN_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"

      - name: Notary credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_ID:?APPLE_ID is required}"
          : "${APPLE_APP_PASSWORD:?APPLE_APP_PASSWORD is required}"
          xcrun notarytool store-credentials ci --keychain "$SIGN_KEYCHAIN" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "NOTARY_PROFILE=ci" >> "$GITHUB_ENV"

      - name: Build DMG
        run: scripts/make_dmg.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="build/Glimpshot-$V.dmg"
          shasum -a 256 "$DMG" | tee "$DMG.sha256"
          gh release create "$RELEASE_TAG" "$DMG" "$DMG.sha256" --verify-tag --title "Glimpshot $V" --generate-notes \
            || gh release upload "$RELEASE_TAG" "$DMG" "$DMG.sha256" --clobber

      - name: Save notarization receipts
        if: always() && hashFiles('build/app-notarization-*.json', 'build/dmg-notarization-*.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notarization-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/app-notarization-*.json
            build/dmg-notarization-*.json
          if-no-files-found: error
          retention-days: 30

      - name: Clean up keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert.p12"
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi


  complete-issues:
    name: Complete issues after successful publication
    needs: [release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: labels-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Apply semantic release transition
        uses: ziqq/actions/labeler@a991545704ba3fc43380d2b6024db3ca6935e4a7
        with:
          operation: release-completed
          github-token: ${{ github.token }}
          config-source: api
          allow-empty: 'true'
          allow-pattern-removal: 'true'
          max-targets: '100'

  notify:
    name: Notify release or deploy result
    needs: [release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NOTIFY_DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
      NOTIFY_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      NOTIFY_TELEGRAM_TARGETS: ${{ secrets.TELEGRAM_TARGETS }}
    steps:
      - name: Checkout trusted notification template
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Notify Discord and Telegram
        uses: ziqq/actions/notify@ccd1a799683cd461a45d9303ac6fcb2792f8f5d2
        with:
          providers: discord,telegram
          template-path: .github/notify/templates/release.md
          variables: |
            {
              "pub_dev_url": "",
              "status_label": ${{ toJSON(contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || contains(needs.*.result, 'skipped') && 'skipped' || 'success') }}
            }
          failure-policy: required
          timeout-ms: "10000"
          max-attempts: "5"
          discord-webhooks: ${{ env.NOTIFY_DISCORD_WEBHOOKS }}
          telegram-bot-token: ${{ env.NOTIFY_TELEGRAM_BOT_TOKEN }}
          telegram-targets: ${{ env.NOTIFY_TELEGRAM_TARGETS }}
