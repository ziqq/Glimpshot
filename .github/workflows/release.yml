name: Release

# Push a tag like v0.2.0 → builds, signs, notarizes (when secrets exist) and publishes the DMG.
#
# Optional secrets for a signed + notarized build:
#   DEVELOPER_ID_P12        base64 of the "Developer ID Application" certificate exported as .p12
#   DEVELOPER_ID_PASSWORD   password of that .p12
#   APPLE_ID                Apple ID email used for notarization
#   APPLE_TEAM_ID           Team ID (10 characters, from developer.apple.com → Membership)
#   APPLE_APP_PASSWORD      app-specific password from appleid.apple.com
# Without them the DMG is ad-hoc signed (fine for testing, blocked by Gatekeeper on other Macs).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (e.g. 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Toolchain
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Stamp version
        run: |
          V="${VERSION#v}"
          echo "V=$V" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Resources/Info.plist

      - name: Import Developer ID certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
        if: env.P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Notary credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        if: env.APPLE_ID != ''
        run: |
          xcrun notarytool store-credentials ci --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"
          echo "NOTARY_PROFILE=ci" >> "$GITHUB_ENV"

      - name: Build DMG
        run: scripts/make_dmg.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="build/Glimpshot-$V.dmg"
          shasum -a 256 "$DMG" | tee "$DMG.sha256"
          gh release create "v$V" "$DMG" "$DMG.sha256" --title "Glimpshot $V" --generate-notes \
            || gh release upload "v$V" "$DMG" "$DMG.sha256" --clobber

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true


  complete-issues:
    name: Complete issues after successful publication
    needs: [release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: labels-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Apply semantic release transition
        uses: ziqq/actions/labeler@a991545704ba3fc43380d2b6024db3ca6935e4a7
        with:
          operation: release-completed
          github-token: ${{ github.token }}
          config-source: api
          allow-empty: 'true'
          allow-pattern-removal: 'true'
          max-targets: '100'

  notify:
    name: Notify release or deploy result
    needs: [release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NOTIFY_DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
      NOTIFY_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      NOTIFY_TELEGRAM_TARGETS: ${{ secrets.TELEGRAM_TARGETS }}
    steps:
      - name: Checkout trusted notification template
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Notify Discord and Telegram
        uses: ziqq/actions/notify@ccd1a799683cd461a45d9303ac6fcb2792f8f5d2
        with:
          providers: discord,telegram
          template-path: .github/notify/templates/release.md
          variables: |
            {
              "pub_dev_url": "",
              "status_label": ${{ toJSON(contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || contains(needs.*.result, 'skipped') && 'skipped' || 'success') }}
            }
          failure-policy: required
          timeout-ms: "10000"
          max-attempts: "5"
          discord-webhooks: ${{ env.NOTIFY_DISCORD_WEBHOOKS }}
          telegram-bot-token: ${{ env.NOTIFY_TELEGRAM_BOT_TOKEN }}
          telegram-targets: ${{ env.NOTIFY_TELEGRAM_TARGETS }}
