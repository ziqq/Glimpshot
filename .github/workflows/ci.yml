name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          swift --version

      - name: Build (release, arm64)
        run: swift build -c release --arch arm64

      - name: Check localizations are in sync
        run: |
          python3 scripts/strings.py
          git diff --exit-code Resources/ || (echo "Run scripts/strings.py and commit the result" && exit 1)
